name: Field app validation
on:
  pull_request:
  push:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.6'
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-pub
      - run: flutter test --no-pub
      - name: Scan tracked source for secrets
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o "$RUNNER_TEMP/gitleaks.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          mkdir "$RUNNER_TEMP/tracked-source"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/tracked-source"
          "$RUNNER_TEMP/gitleaks" dir "$RUNNER_TEMP/tracked-source" --redact --no-banner
      - name: Export Dart dependency inventory
        run: dart pub deps --json > "$RUNNER_TEMP/watsolution-dart-dependencies.json"
      - run: flutter build apk --debug --no-pub
      - name: Reject bundled environment files
        run: |
          python3 - <<'PY'
          import zipfile
          with zipfile.ZipFile('build/app/outputs/flutter-apk/app-debug.apk') as apk:
              assert not any(name.rsplit('/', 1)[-1].startswith('.env') for name in apk.namelist()), 'Environment file in APK'
          PY
